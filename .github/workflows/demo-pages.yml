name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Demo/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate static demo
        shell: bash
        run: |
          test -f Demo/index.html || {
            echo "Demo/index.html is missing."
            exit 1
          }
          test -d Demo/assets || {
            echo "Demo/assets is missing."
            exit 1
          }

      - name: Prepare GitHub Pages paths
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          base_path="/${repo_name}"
          find Demo -name "*.html" -type f -print0 | xargs -0 sed -i \
            -e "s#=\"/#=\"${base_path}/#g" \
            -e "s#:\"/#:\"${base_path}/#g"
          touch Demo/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
